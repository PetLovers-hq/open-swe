name: Publish OpenSWE sandbox image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile.sandbox
      - .github/workflows/publish_sandbox_image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: open-swe-sandbox-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/open-swe-sandbox
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.sandbox
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=open-swe-sandbox
          cache-to: type=gha,mode=max,scope=open-swe-sandbox
